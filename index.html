<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typing Game 20 Parts with Secret Admin Panel and Announcements</title>
<style>
  @keyframes backgroundAnimation {
    0%, 100% {background-position: 0% 50%; }
    50% {background-position: 100% 50%; }
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #335d99, #1e3c72);
    background-size: 400% 400%;
    animation: backgroundAnimation 25s ease infinite;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-radial-gradient(circle, rgba(255,255,255,0.02) 0, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 30px);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    background: #fff;
    padding: 35px 40px 80px;
    border-radius: 20px;
    width: 720px;
    max-width: 95vw;
    box-shadow: 0 25px 50px rgb(0 0 0 / 0.3);
    position: relative;
    color: #222;
    z-index: 1;
  }
  #stage {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 18px;
    user-select: none;
  }
  #timer {
    font-size: 22px;
    font-weight: 600;
    text-align: right;
    margin-bottom: 18px;
    user-select: none;
    color: #444;
  }
  .progress-bar {
    background: #ddd;
    border-radius: 12px;
    height: 12px;
    width: 100%;
    margin-bottom: 32px;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgb(0 0 0 / 0.1);
  }
  .bar {
    background: #4a90e2;
    height: 100%;
    border-radius: 12px 0 0 12px;
    width: 0%;
    box-shadow: 0 0 10px #4a90e2aa;
    transition: width 0.3s ease;
  }
  #text {
    font-size: 26px;
    line-height: 1.5;
    min-height: 110px;
    border: 2.5px solid #bbb;
    padding: 24px 28px;
    border-radius: 20px;
    background: #fafafa;
    box-shadow: inset 0 3px 10px rgb(0 0 0 / 0.08);
    letter-spacing: 1.4px;
    user-select: none;
    white-space: pre-wrap;
    margin-bottom: 35px;
  }
  .correct {
    color: #2ecc40;
    background: #e1f7d5;
    border-radius: 6px;
    transition: background 0.3s ease;
  }
  .wrong {
    color: #e74c3c;
    background: #fdecea;
    border-radius: 6px;
    transition: background 0.3s ease;
  }
  #input {
    width: 100%;
    height: 80px;
    font-size: 22px;
    font-family: monospace;
    padding: 20px 22px;
    border-radius: 20px;
    border: 2.5px solid #999;
    box-shadow: 0 5px 18px rgb(0 0 0 / 0.1);
    resize: none;
    outline-offset: 3px;
    outline-color: #4a90e2;
    color: #212121;
  }
  #input:focus {
    border-color: #4a90e2;
    box-shadow: 0 0 12px #4a90e2bb;
  }
  button {
    width: 170px;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 700;
    border-radius: 25px;
    border: none;
    margin-top: 24px;
    cursor: pointer;
    background: #4a90e2;
    color: #fff;
    box-shadow: 0 10px 20px #2f65bfaa;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  button:hover {
    background: #3b73ba;
    box-shadow: 0 14px 26px #2a5bb0cc;
  }
  #secretInput {
    position: fixed;
    bottom: 10px;
    left: 10px;
    padding: 6px 12px;
    font-size: 14px;
    letter-spacing: 1.6px;
    border-radius: 12px;
    font-family: monospace;
    width: 260px;
    border: 1.8px solid #ccc;
    z-index: 50;
    box-sizing: border-box;
    color: #666;
  }
  #secretPanel {
    position: fixed;
    bottom: 80px;
    left: 10px;
    background: #273c75ee;
    padding: 20px 32px;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    width: 320px;
    text-align: center;
    color: white;
    user-select: none;
    z-index: 51;
    /* Displayed by default */
  }
  #secretPanel button, #secretPanel input {
    margin-top: 12px;
    border-radius: 20px;
    font-size: 18px;
    padding: 10px 0;
    width: 100%;
    border: none;
    outline: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  #secretPanel input {
    padding-left: 20px;
    font-family: monospace;
    color: #333;
  }
  #closeSecretBtn {
    background: #e74c3cbb;
  }
  #closeSecretBtn:hover {
    background: #c0392b;
  }
  #secretPanel button:not(#closeSecretBtn) {
    background: #2ecc40bb;
    color: white;
  }
  #secretPanel button:not(#closeSecretBtn):hover {
    background: #27ae60;
  }
  @media (max-width: 480px) {
    .container { width: 90vw; padding: 20px; }
    #text { font-size: 20px; min-height: 90px; }
    #input { height: 60px; font-size: 18px; padding: 15px 18px; }
    button { width: 150px; font-size: 18px; padding: 14px 0; }
    #secretInput { width: 90vw; bottom: 20px; left: 5vw; }
    #secretPanel { width: 90vw; left: 5vw; }
  }
</style>
</head>
<body>
  <main class="container" role="main" aria-label="Typing game container">
    <h1 id="stage" aria-live="polite">Stage: 1 / 20</h1>
    <div id="timer" aria-live="polite">Time: 120</div>
    <div class="progress-bar" aria-hidden="true"><div class="bar" id="bar"></div></div>
    <section id="text" aria-live="polite" aria-atomic="true"></section>
    <textarea id="input" aria-label="Typing input area" placeholder="Start typing here..." autofocus></textarea>
    <button id="restartBtn">Restart</button>
    <section>
      <h2>Announcements</h2>
      <div id="announcementDisplay" style="min-height: 60px; max-height: 150px; overflow-y: auto; border: 1px solid #bbb; padding: 6px; margin-top: 10px; background: #f9f9f9;"></div>
    </section>
  </main>

  <input id="secretInput" aria-label="Secret code input" placeholder="Enter admin code..." autocomplete="off" spellcheck="false" />

  <section id="secretPanel" aria-hidden="true">
    <h2>Admin Panel</h2>
    <button id="autoTypeBtn" aria-label="Auto type button">AutoType</button>
    <button id="skipStageBtn" aria-label="Skip current stage">Skip Stage</button>
    <button id="restartBtnSecret" aria-label="Restart game">Restart Game</button>
    <button id="resetProgressBtn" aria-label="Reset progress to stage 1">Reset Progress</button>
    <button id="toggleTimerBtn" aria-label="Pause or resume timer">Pause Timer</button>
    <button id="toggleHighlightBtn" aria-label="Toggle highlighting of letters">Toggle Highlight</button>
    <input id="customTextInput" aria-label="Custom text to add" placeholder="Add custom text for next stage" />
    <button id="addCustomTextBtn" aria-label="Add custom text">Add Text</button>
    <input id="announcementInput" aria-label="Announcement text input" placeholder="Write announcement here" />
    <button id="announcementSendBtn" aria-label="Send announcement to all">Send Announcement</button>
    <button id="closeSecretBtn" aria-label="Close admin panel">Close</button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const stages = [
      `In the twilight of a serene evening, the sun dipped below the horizon painting the sky with hues of orange and crimson as gentle breezes whispered through the leaves.`,
      // ... other stages omitted for brevity
    ];

    let currentStage = 0;
    let charEls = [];
    let timerInterval = null;
    let startTime = null;
    const timeLimit = 120; // 2 minutes
    let gameEnded = false;
    let autoTyping = false;
    let autoTypeIndex = 0;
    let autoTypeInterval = null;
    let timerPaused = false;
    let pausedElapsed = 0;
    let highlightsOn = true;

    const textEl = document.getElementById('text');
    const inputEl = document.getElementById('input');
    const stageEl = document.getElementById('stage');
    const timerEl = document.getElementById('timer');
    const barEl = document.getElementById('bar');

    // Announcement elements
    const announcementDisplay = document.getElementById('announcementDisplay');
    const announcementInput = document.getElementById('announcementInput');
    const announcementSendBtn = document.getElementById('announcementSendBtn');

    // Other admin panel elements
    const secretInput = document.getElementById('secretInput');
    const secretPanel = document.getElementById('secretPanel');
    const autoTypeBtn = document.getElementById('autoTypeBtn');
    const skipStageBtn = document.getElementById('skipStageBtn');
    const restartBtn = document.getElementById('restartBtn');
    const restartBtnSecret = document.getElementById('restartBtnSecret');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const toggleTimerBtn = document.getElementById('toggleTimerBtn');
    const toggleHighlightBtn = document.getElementById('toggleHighlightBtn');
    const customTextInput = document.getElementById('customTextInput');
    const addCustomTextBtn = document.getElementById('addCustomTextBtn');
    const closeSecretBtn = document.getElementById('closeSecretBtn');

    // Your existing functions (populateText, startGame, etc.) 
    // Admin panel controls, announcement load/send functions...

    // Supabase initialization
    const supabaseUrl = 'https://your-project-ref.supabase.co'; // Replace with your URL
    const supabaseKey = 'your-publishable-anon-key'; // Replace with your anon key
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadAnnouncements() {
      const { data, error } = await supabase.from('announcements').select('*').order('created_at', { ascending: false });
      if (error) {
        console.error('Error loading announcements:', error);
        return;
      }
      announcementDisplay.innerHTML = '';
      data.forEach(a => {
        const p = document.createElement('p');
        p.textContent = a.message;
        announcementDisplay.appendChild(p);
      });
    }

    async function addAnnouncement(msg) {
      if (!msg) return;
      const { error } = await supabase.from('announcements').insert([{ message: msg }]);
      if (error) console.error('Error adding announcement:', error);
    }

    announcementSendBtn.addEventListener('click', async () => {
      const msg = announcementInput.value.trim();
      if (msg) {
        await addAnnouncement(msg);
        announcementInput.value = '';
      }
    });

    // Supabase real-time subscription
    supabase
      .channel('public:announcements')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, payload => {
        loadAnnouncements();
      })
      .subscribe();

    window.onload = () => {
      startGame();
      loadAnnouncements();
    };

    // Add your other previous JS logic unchanged...

  </script>
</body>
</html>
